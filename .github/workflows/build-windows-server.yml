name: Windows Server

# Compila el servidor para Windows y entrega un paquete listo para correr.
#
# No reemplaza a server.yml: aquel valida PRs con dorny/paths-filter y no sube
# artefacto. Este se dispara a mano (o al tocar server/) y siempre compila.
#
# Por que no reutiliza server.yml:
#   - en workflow_dispatch, paths-filter no encuentra "server/**" cambiado y
#     el job build queda salteado (salia solo changes + result);
#   - server.yml no tiene actions/upload-artifact, asi que no hay .exe que bajar.
#
# El paquete lo arma scripts/ci/package-windows.ps1: .exe + MuServer/ (ini,
# DATA, SQL) + las DLL del CRT dinamico de JoinServer/DataServer.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Arquitectura"
        type: choice
        options: ["x64", "x86"]
        default: "x64"
      config:
        description: "Configuracion"
        type: choice
        options: ["Release", "Debug"]
        default: "Release"
  push:
    branches: ["main", "fase/*"]
    paths:
      - "server/**"
      - "scripts/ci/**"
      - ".github/workflows/build-windows-server.yml"

permissions:
  contents: read

concurrency:
  group: win-server-${{ github.event_name }}-${{ github.ref_name }}-${{ inputs.arch }}-${{ inputs.config }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows ${{ inputs.arch || 'x64' }} ${{ inputs.config || 'Release' }}
    runs-on: windows-2022
    defaults:
      run:
        working-directory: server
    env:
      ARCH: ${{ inputs.arch || 'x64' }}
      CFG: ${{ inputs.config || 'Release' }}
      # windows-x64-release / windows-x86-debug / ...
      PRESET: windows-${{ inputs.arch || 'x64' }}-${{ inputs.config == 'Debug' && 'debug' || 'release' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # El repo pesa ~330 MB por client/bin; aca solo se compila server/.
          sparse-checkout: |
            server
            scripts
            .github
          sparse-checkout-cone-mode: true

      - name: Entorno
        run: |
          cmake --version
          Write-Host "Preset: $env:PRESET"
          Write-Host "Config: $env:CFG"

      - name: Configurar
        run: cmake --preset $env:PRESET

      - name: Compilar
        run: cmake --build --preset $env:PRESET --parallel 4

      - name: Verificar paquete de mass teleport
        if: env.CFG == 'Release'
        run: python -B tests/recall_packet_layout.py --architecture ${{ inputs.arch == 'x86' && 'Win32' || 'x64' }}

      - name: Reunir el paquete
        working-directory: ${{ github.workspace }}
        run: pwsh -NoProfile -File ./scripts/ci/package-windows.ps1 -Config $env:CFG -Arch $env:ARCH -Preset $env:PRESET -Workspace $env:GITHUB_WORKSPACE

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MuServer-win-${{ inputs.arch || 'x64' }}-${{ inputs.config || 'Release' }}
          path: ${{ github.workspace }}/artifact
          if-no-files-found: error
          retention-days: 30
